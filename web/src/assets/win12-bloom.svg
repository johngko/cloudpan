<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3fb"/>
      <stop offset="0.45" stop-color="#eceafd"/>
      <stop offset="1" stop-color="#c7d9ff"/>
    </linearGradient>
    <linearGradient id="pBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3f6fe8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a2f7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8250d8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3e2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d865b8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="pCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe0f7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4f9fd8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="bokeh" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 环境光晕 -->
  <circle cx="330" cy="200" r="260" fill="#ffd9f2" opacity="0.55" filter="url(#haze)"/>
  <circle cx="1650" cy="220" r="300" fill="#c9dcff" opacity="0.6" filter="url(#haze)"/>
  <circle cx="1500" cy="920" r="280" fill="#e3d1ff" opacity="0.5" filter="url(#haze)"/>

  <!-- 花瓣：外层柔光层 -->
  <g transform="translate(930 600)" filter="url(#soft)" opacity="0.62">
    <g transform="rotate(0)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pBlue)"/></g>
    <g transform="rotate(30)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pPurple)"/></g>
    <g transform="rotate(60)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pPink)"/></g>
    <g transform="rotate(90)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pCyan)"/></g>
    <g transform="rotate(120)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pBlue)"/></g>
    <g transform="rotate(150)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pPurple)"/></g>
    <g transform="rotate(180)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pPink)"/></g>
    <g transform="rotate(210)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pCyan)"/></g>
    <g transform="rotate(240)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pBlue)"/></g>
    <g transform="rotate(270)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pPurple)"/></g>
    <g transform="rotate(300)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pPink)"/></g>
    <g transform="rotate(330)"><ellipse cx="250" cy="0" rx="260" ry="86" fill="url(#pCyan)"/></g>
  </g>

  <!-- 花瓣：内层锐利层 -->
  <g transform="translate(930 600) rotate(14)" filter="url(#soft2)" opacity="0.58">
    <g transform="rotate(0)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pBlue)"/></g>
    <g transform="rotate(45)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pPurple)"/></g>
    <g transform="rotate(90)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pPink)"/></g>
    <g transform="rotate(135)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pCyan)"/></g>
    <g transform="rotate(180)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pBlue)"/></g>
    <g transform="rotate(225)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pPurple)"/></g>
    <g transform="rotate(270)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pPink)"/></g>
    <g transform="rotate(315)"><ellipse cx="170" cy="0" rx="180" ry="52" fill="url(#pCyan)"/></g>
  </g>

  <!-- 花芯 -->
  <circle cx="930" cy="600" r="46" fill="#ffffff" opacity="0.85" filter="url(#soft2)"/>
  <circle cx="930" cy="600" r="18" fill="#f7e9ff" opacity="0.9"/>

  <!-- 焦外光斑（bokeh，摄影感） -->
  <g filter="url(#bokeh)" opacity="0.4">
    <circle cx="420" cy="790" r="30" fill="#ffffff"/>
    <circle cx="580" cy="290" r="18" fill="#ffffff"/>
    <circle cx="1420" cy="320" r="26" fill="#ffffff"/>
    <circle cx="1700" cy="720" r="34" fill="#ffffff"/>
    <circle cx="1230" cy="920" r="16" fill="#ffffff"/>
    <circle cx="180" cy="500" r="20" fill="#ffffff"/>
  </g>

  <!-- 胶片颗粒 -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05"/>
</svg>
