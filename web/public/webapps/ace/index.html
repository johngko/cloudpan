<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 原 sdk.js?naive=true = core SDK + Vue3 + NaiveUI（UMD）；
       此处改为 CloudPan 桥 + 本地 lib（v9os assets/expand 的 UMD 构建） -->
  <script src="lib/vue.global.prod.js"></script>
  <script src="lib/index.prod.js"></script>
  <script src="/webapps/_bridge/cloudpan.js"></script>
  <script src="js/v9os-webos-compat.js"></script>
  <meta charset="UTF-8">
  <title>多功能编辑器</title>
  <meta name="referrer" content="never">
  <style>
    html,body,#app{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
    .nf-page{height:100vh;font:14px system-ui;display:flex;flex-direction:column;background:#fff;color:#1f2937}
    .nf-toolbar{display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid #e5e7eb;background:#fafafa}
    .nf-tabs{display:flex;gap:2px;border-bottom:1px solid #e5e7eb;background:#f5f5f5;overflow-x:auto}
    .nf-tab{border:0;padding:7px 10px;background:transparent;cursor:pointer;white-space:nowrap}
    .nf-tab.active{background:#fff}
    .nf-tab b{margin-left:8px;color:#888}
    .nf-panes{flex:1;min-height:0;position:relative}
    .nf-pane{position:absolute;inset:0}
    .nf-home{padding:14px;font:14px system-ui}
    .nf-history{padding:8px;border-bottom:1px solid #eee;cursor:pointer;display:flex;gap:8px;align-items:center}
    .nf-muted{color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .nf-direct-home{height:100%;display:grid;place-items:center;background:var(--user-bg-1-color,#f6f7fb);font:14px system-ui;color:var(--user-text-1-color,#1f2937)}
    .nf-home-card{text-align:center;max-width:720px;padding:32px}
    .nf-home-icon{width:72px;height:72px;object-fit:contain;margin-bottom:14px}
    .nf-home-card h1{margin:0 0 8px;font-size:28px;font-weight:700}
    .nf-home-card .nf-muted{color:var(--user-text-2-color,#667085);white-space:normal;margin-bottom:24px}
    .nf-home-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .nf-home-actions button,.nf-home-actions .n-button{font-size:16px;padding:12px 22px;min-width:128px;border-radius:10px}
    .nf-home-actions button{border:1px solid var(--user-border-color,#d0d5dd);background:#fff;cursor:pointer}
    
  </style>
</head>
<body>
<div id="app"></div>
<script src="js/boot.js"></script>
<script src="js/index-init.js"></script>
</body>
</html>
