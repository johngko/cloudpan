<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG 编辑器</title>
  <script src="/webapps/_bridge/cloudpan.js"></script>
  <style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--user-bg-1-color,#f6f7fb);color:var(--user-text-1-color,#111827);font:14px system-ui}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--user-text-2-color,#667085)}iframe{width:100%;height:100%;border:0}.direct-home{height:100%;display:grid;place-items:center;text-align:center}.direct-card{padding:32px;max-width:720px}.direct-card img{width:72px;height:72px;margin-bottom:14px}.direct-card h1{margin:0 0 8px;font-size:28px}.direct-card p{color:var(--user-text-2-color,#667085);margin-bottom:24px}.direct-actions{display:flex;gap:14px;justify-content:center}.direct-actions button{font-size:16px;padding:12px 22px;min-width:128px;border-radius:10px;border:1px solid #d0d5dd;background:#fff;cursor:pointer}</style>

  <script>
    function applyExternalOpenParams(src){
      var params = new URL(location.href).searchParams;
      if(params.get('action') !== 'open') return src;
      var url = new URL(src, location.href);
      ['action','ext','name','size','url'].forEach(function(key){
        var val = params.get(key);
        if(val != null) url.searchParams.set(key, val);
      });
      if(params.get('saveData')) url.searchParams.set('saveData', params.get('saveData'));
      url.searchParams.set('expAction', params.get('saveData') ? 'edit' : 'open');
      return url.href;
    }
  </script>
</head>
<body>
  <div id="home" class="direct-home"><div class="direct-card"><img src="static/images/icon.svg"><h1>SVG 编辑器</h1><p>正在创建空白 SVG 文档...</p></div></div><iframe id="frame" src="about:blank" style="display:none"></iframe>
  <script>
    window.addEventListener('message', function(e){
      if(e.data && e.data.action === 'addOpenFiles'){
        var f=document.getElementById('frame');
        if(f) f.contentWindow.postMessage(e.data,'*');
      }
    });

    function openFrameFile(file){
      var f = document.getElementById('frame');
      if(!f || !file) return;
      var u = new URL('./static/methodDraw/index.html', location.href);
      u.searchParams.set('action','open');
      u.searchParams.set('expAction', file.saveData ? 'edit' : 'open');
      ['ext','name','size','url'].forEach(function(key){
        if(file[key] != null) u.searchParams.set(key, file[key]);
      });
      if(file.saveData) u.searchParams.set('saveData', encodeURIComponent(JSON.stringify(file.saveData)));
      f.onload = function(){
        f.contentWindow && f.contentWindow.postMessage({action:'addOpenFiles', files:[file]}, '*');
      };
      showFrame(u.href);
    }

    function waitV9os(cb){
      if(window.$v9os && $v9os.event && $v9os.event.on) return cb();
      setTimeout(function(){ waitV9os(cb); }, 30);
    }

    var params = new URL(location.href).searchParams;
    function showFrame(src){ var h=document.getElementById('home'); var f=document.getElementById('frame'); if(h)h.style.display='none'; if(f){f.style.display='block'; f.src=src || './static/methodDraw/index.html';} }
    var __f=document.getElementById('frame');
    if(params.get('action') === 'open' && params.get('url')) showFrame(applyExternalOpenParams('./static/methodDraw/index.html'));
    if(params.get('action') !== 'open') showFrame('./static/methodDraw/index.html');
    if(params.get('action') === 'open' && !params.get('url')){
      waitV9os(function(){
        $v9os.event.on('fileOpenEdit', function(params){
          if(!params || params.target !== 'svg_editor') return;
          openFrameFile(params.data || {});
        });
        $v9os.event.emit('initFileOpenEdit', {type: 'fileOpenEdit', confirm: true});
      });
    }

  </script>
</body>
</html>
